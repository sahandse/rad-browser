name: One-time source fix

on:
  push:
    paths:
      - '.github/workflows/source-fix.yml'
      - 'tool/apply_tracking_source_fix.py'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply per-site tracking exception fix
        run: python3 tool/apply_tracking_source_fix.py

      - name: Commit source fix if changed
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/browser/presentation/pages/browser_page.dart
          git commit -m 'privacy: honor tracking exceptions in content blockers'
          git push origin HEAD:main
