name: One-time home search suggestions

on:
  push:
    paths:
      - '.github/workflows/patch-home-suggestions-once.yml'
      - 'tool/patch_home_suggestions.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Home search suggestions
        run: python3 tool/patch_home_suggestions.py
      - name: Commit Home search suggestions
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/home/presentation/pages/home_page.dart
          git commit -m 'feat: add live suggestions to RAD home search'
          git push origin HEAD:main
