name: One-time smart search finalizer

on:
  push:
    paths:
      - '.github/workflows/finalize-smart-search-once.yml'
      - 'tool/finalize_smart_search.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize smart search
        run: python3 tool/finalize_smart_search.py
      - name: Commit final smart-search integration
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/features/home/presentation/pages/home_page.dart lib/features/search/data/rad_smart_search_service.dart lib/features/settings/presentation/pages/settings_page.dart
          git commit -m 'feat: finish smart search UX and privacy controls'
          git push origin HEAD:main
