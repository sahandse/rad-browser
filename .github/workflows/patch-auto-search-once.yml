name: One-time automatic search routing

on:
  push:
    paths:
      - '.github/workflows/patch-auto-search-once.yml'
      - 'tool/patch_auto_search.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply automatic search routing
        run: python3 tool/patch_auto_search.py
      - name: Commit automatic search routing
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/home/presentation/pages/home_page.dart \
            lib/features/browser/presentation/pages/browser_page.dart \
            lib/features/search/data/rad_search_service.dart \
            lib/features/settings/presentation/pages/settings_page.dart \
            assets/data/iran_sites.json \
            pubspec.yaml CHANGELOG.md
          git commit -m 'feat: route searches automatically by network state'
          git push origin HEAD:main
