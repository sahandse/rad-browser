name: One-time official logo home fix

on:
  push:
    paths:
      - '.github/workflows/logo-home-fix.yml'
      - 'tool/apply_official_logo_home.py'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply official RAD logo to Home
        run: python3 tool/apply_official_logo_home.py
      - name: Commit Home logo integration
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/home/presentation/pages/home_page.dart
          git commit -m 'brand: use official RAD logo on Home'
          git push origin HEAD:main
