name: One-time search results syntax fix

on:
  push:
    paths:
      - '.github/workflows/fix-search-results-syntax-once.yml'
      - 'tool/fix_search_results_syntax.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix search results syntax
        run: python3 tool/fix_search_results_syntax.py
      - name: Commit syntax fix
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/search/presentation/pages/search_results_page.dart
          git commit -m 'fix: repair infinite search results layout'
          git push origin HEAD:main
