name: One-time native search navigation fix

on:
  push:
    paths:
      - '.github/workflows/native-search-navigation-fix.yml'
      - 'tool/patch_native_search_navigation.py'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch browser search navigation
        run: python3 tool/patch_native_search_navigation.py
      - name: Commit native search navigation
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/browser/presentation/pages/browser_page.dart
          git commit -m 'search: use native RAD results from address bar'
          git push origin HEAD:main
