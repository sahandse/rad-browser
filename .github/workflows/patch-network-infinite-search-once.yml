name: One-time network-aware infinite search

on:
  push:
    paths:
      - '.github/workflows/patch-network-infinite-search-once.yml'
      - 'tool/patch_network_infinite_search.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply network-aware infinite search
        run: python3 tool/patch_network_infinite_search.py
      - name: Commit network-aware infinite search
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/network/data/network_probe_service.dart \
            lib/features/home/presentation/pages/home_page.dart \
            lib/features/search/data/rad_search_service.dart \
            lib/features/search/presentation/pages/search_results_page.dart \
            pubspec.yaml CHANGELOG.md
          git commit -m 'feat: add network-aware infinite search'
          git push origin HEAD:main
