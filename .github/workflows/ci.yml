name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing platform scaffolding
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name rad_browser --org com.sahand --platforms=android
          fi
          if [ ! -f web/index.html ]; then
            flutter create . --project-name rad_browser --org com.sahand --platforms=web
          fi
          rm -f test/widget_test.dart

      - name: Configure Android package and permissions
        run: python3 tool/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No project tests yet; skipping flutter test."
          fi

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Audit Android manifest
        run: |
          unzip -p build/app/outputs/flutter-apk/app-debug.apk AndroidManifest.xml > /tmp/rad-manifest.bin
          strings -el /tmp/rad-manifest.bin > /tmp/rad-manifest.txt
          grep -q 'com.sahand.rad' /tmp/rad-manifest.txt
          if grep -Eq 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES)' /tmp/rad-manifest.txt; then
            echo 'Forbidden Android permission found in merged manifest.'
            grep -E 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES)' /tmp/rad-manifest.txt
            exit 1
          fi

      - name: Build Web release
        run: flutter build web --release

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: rad-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: rad-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7
