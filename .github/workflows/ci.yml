name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing platform scaffolding
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name rad_browser --org com.sahand --platforms=android
          fi
          if [ ! -f web/index.html ]; then
            flutter create . --project-name rad_browser --org com.sahand --platforms=web
          fi
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No project tests yet; skipping flutter test."
          fi

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build Web release
        run: flutter build web --release

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: rad-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: rad-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7
