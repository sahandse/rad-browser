name: rad_browser
description: RAD Browser - a minimal privacy-focused Flutter browser for Android and Web.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_inappwebview: 6.2.0-beta.3
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  html: ^0.15.6
  dio: ^5.11.1
  file_saver: ^0.4.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  permission_handler: ^12.0.3
  persian_fonts: ^1.0.6
  shamsi_date: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/
